# Job Finder - User Configuration

# Path to directory containing your CVs (PDF, Word)
# Drop all your CVs, certifications, experience documents here
cv_input_dir: "./cv_input"

# Output directory for generated tailored CVs and cover letters
output_dir: "./output"

# User preferences - affects tone and style of generated content
preferences:
  # Tone: formal | semi-formal | casual | enthusiastic | professional
  tone: "professional"

  # Writing style: concise | detailed | balanced
  style: "balanced"

  # Focus areas to emphasize (optional, from your CV)
  # e.g. ["leadership", "technical skills", "remote work experience"]
  focus_areas: []

  # Default language proficiencies - used when the CV doesn't specify levels.
  # Leave empty [] to skip the Languages section when not extracted from CV.
  # Levels: Native, Fluent, Proficient, Advanced, Intermediate, Elementary, Beginner
  default_languages:
    - "English - Proficient"
    - "German - Intermediate"
    - "French - Beginner"

# Job search settings
job_search:
  country: "ch" # Adzuna country code: de, at, ch, fr, it, gb, us
  max_results: 50 # Jobs to fetch per search (max 50 per Adzuna page)
  keywords: "" # Optional: additional keywords (leave empty to derive from CV)

  # Location search: search nearby first, then expand.
  # Each entry is tried in order. Results are combined and deduplicated.
  # Leave empty [] to search the entire country.
  locations:
    - "Basel"
    - "Basel-Stadt"
    - "Basel-Landschaft"
  radius_km: 30 # Search radius in km around each location (0 = exact match)

  # Language strategy for search queries:
  #   "auto"          - English first, then local languages if not enough results (default)
  #   "english_only"  - search only in English, skip local translations
  #   "local_first"   - local languages first, then English as fallback
  language: "english_only"

  # Exclude jobs whose title or description contains text in these languages.
  # Use ISO language codes: de, fr, it, nl, es, pt, pl
  # Example: ["de"] to skip German-language postings in Switzerland
  # Leave empty [] to keep all results.
  exclude_languages: []

  # AI language validation: after the regex filter, use the LLM to re-check
  # surviving jobs for hidden language requirements the regex missed.
  # When a requirement is found, the system learns the phrase and re-filters.
  # true  = enabled (slower but catches edge cases)
  # false = disabled (rely on regex filter only)
  ai_language_validation: true

  # Maximum validation rounds (each round scans remaining jobs).
  # More rounds = more thorough but slower. 2-3 is usually sufficient.
  ai_validation_rounds: 3

# Ollama / AI settings
ai:
  model: "qwen2.5:7b" # Model to use - run: ollama pull qwen2.5:7b
  temperature: 0.7 # Lower = more consistent, Higher = more creative
  timeout: 120 # Seconds to wait for AI response
