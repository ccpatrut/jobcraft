# Job Finder - User Configuration

# Path to directory containing your CVs (PDF, Word, .txt supplements)
cv_input_dir: "./cv_input"

# Output directory for generated tailored CVs and cover letters
output_dir: "./output"

# User preferences - affects tone and style of generated content
preferences:
  tone: "professional"
  style: "balanced"

  # Used for job matching/ranking only (not CV generation tone)
  search_profile_summary: >
    Career change into Basel-area gastronomy. Malta culinary training
    (Kitchen & Larder, Pastry & Baking). Seeking commis, kitchen assistant,
    bakery helper, or restaurant service / Aushilfe roles.

  # Override CV-extracted languages (mode: override | merge)
  languages_mode: override
  languages:
    - "English - Proficient"
    - "German - B2"
    - "Spanish - Proficient"
    - "French - Beginner"

  focus_areas:
    - "food hygiene and kitchen operations"
    - "pastry and baking fundamentals"
    - "customer service"
    - "teamwork under pressure"
    - "multilingual service (English, Spanish, German)"

  career_pivot:
    enabled: true
    from_industries: ["account management", "igaming", "tech sales", "digital marketing"]
    motivation: >
      Transitioning into Basel-region kitchen, bakery, and restaurant service.
      Malta Institute culinary training (Kitchen & Larder, Pastry & Baking).
      Open to Commis, Küchenhilfe, Aushilfe, and entry-level gastronomy roles.

  default_languages:
    - "English - Proficient"
    - "German - B2"
    - "Spanish - Proficient"
    - "French - Beginner"

# Job search settings
job_search:
  country: "ch"
  mode: "default"
  countries: ["ch"]
  max_results: 50
  keywords: >-
    aushilfe gastronomie küchenhilfe commis de cuisine commis de rang
    kellner service restaurant spüler bäckerei bäcker konditor patisserie
    pastry assistant kitchen porter catering helfer küche
  contract_type: ""
  salary_min: 0
  sources: ["adzuna", "arbeitnow"]

  locations: ["Basel"]
  radius_km: 35
  search_nationwide: false

  language: "auto"
  exclude_languages: []

  # Tier 3 = B1/intermediate — keeps German job ads in CH (tier 4 = B2+ only)
  description_language_min_tier: 3

  # Embedding cutoff; career_pivot uses 0.25 when min_similarity unset
  min_similarity: 0.25

  industries:
    - "bakery"
    - "bäckerei"
    - "pastry"
    - "kitchen"
    - "gastronomy"
    - "restaurant"
    - "catering"
    - "food service"

  ai_language_validation: false
  ai_validation_rounds: 3

# AI settings
ai:
  provider: "auto"
  model: "qwen3:8b"
  gemini_model: "gemini-2.5-flash"
  temperature: 0.7
  timeout: 120
  requests_per_minute: 14
  use_embeddings: true
  rerank_with_llm: true

output:
  formats: ["pdf", "docx"]
