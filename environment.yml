# Conda environment for Job Finder
# Create with: conda env create -f environment.yml
# Activate with: conda activate job-finder

name: job-finder
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - ollama>=0.3.0
    - pymupdf>=1.24.0
    - python-docx>=1.1.0
    - requests>=2.31.0
    - pydantic>=2.5.0
    - python-dotenv>=1.0.0
    - pyyaml>=6.0.1
    - jinja2>=3.1.0
