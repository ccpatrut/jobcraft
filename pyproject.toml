[project]
name = "job-finder"
version = "0.1.0"
description = "AI-powered job matching and tailored CV/cover letter generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "ipykernel>=7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
