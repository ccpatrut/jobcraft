name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check src main.py && uv run ruff format --check src main.py

      - name: Verify imports
        run: |
          uv run python -c "
          from src.config import load_config, get_preferences
          from src.document_loader import load_documents_from_dir
          from src.models import UserProfile, JobListing, UserPreferences
          from src.job_fetcher import fetch_adzuna_jobs
          from src.job_matcher import rank_jobs_with_llm
          from src.cv_generator import generate_tailored_cv, _validate_cv
          from src.cover_letter_generator import generate_cover_letter, _validate_cover_letter
          from src.llm_provider import LLMProvider, create_provider
          from src.job_sources import JobSource, AdzunaSource, ArbeitnowSource, create_sources
          from src.lang_detect import detect_languages_batch
          from src.docx_utils import markdown_to_docx
          from src.database import add_job_note, get_funnel_stats, get_job_notes
          from src.embeddings import PIVOT_INDUSTRY_BOOST
          print('All imports OK')
          "

      - name: Verify config loads
        run: |
          uv run python -c "
          from src.config import load_config
          cfg = load_config()
          assert 'cv_input_dir' in cfg
          assert 'output_dir' in cfg
          print('Config OK')
          "

      - name: Verify document loader (empty dir)
        run: |
          uv run python -c "
          from src.document_loader import load_documents_from_dir
          texts, combined = load_documents_from_dir('./cv_input')
          assert isinstance(texts, list)
          assert isinstance(combined, str)
          print('Document loader OK')
          "
